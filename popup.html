<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabCloser</title>

  <style>
    /* Theme tokens — keep in sync with options.html. color-scheme makes
       browser-rendered UI (scrollbars etc.) follow the same theme. */
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f6f6f8;
      --border: #e2e2e7;
      --text: #1f2328;
      --text-muted: #69707d;
      --accent: #2F55D4;
      --accent-hover: #2444B8;
      --on-accent: #ffffff;
      --danger: #b42318;
      --track-off: #d4d4da;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1f;
        --surface: #26262b;
        --border: #3a3a41;
        --text: #e8e8ea;
        --text-muted: #9a9aa3;
        --accent: #adb4ff;
        --accent-hover: #c4c9ff;
        --on-accent: #17171c;
        --danger: #f28b82;
        --track-off: #4a4a52;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
      width: 340px;
      padding: 14px;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .popup-header h1 {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }

    .status-text {
      display: flex;
      flex-direction: column;
    }

    .status-text strong {
      font-size: 13px;
      font-weight: 600;
    }

    .status-text small {
      color: var(--text-muted);
      font-size: 11px;
    }

    .snooze-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .snooze-row button {
      flex: 1;
    }

    button {
      padding: 6px 12px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      font-weight: 500;
      transition: background-color 0.15s ease-out;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    button.secondary:hover {
      background: var(--surface);
    }

    .manage-row {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 14px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s ease-out;
    }

    .manage-row:hover {
      border-color: var(--accent);
      text-decoration: none;
      color: var(--text);
    }

    .manage-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      background-color: var(--surface);
      border-radius: 6px;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: color 0.15s ease-out;
    }

    .manage-row:hover .manage-icon {
      color: var(--accent);
    }

    .manage-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex-grow: 1;
    }

    .manage-text strong {
      font-size: 12px;
      font-weight: 600;
    }

    .manage-text small {
      font-size: 11px;
      color: var(--text-muted);
    }

    .manage-chevron {
      display: inline-flex;
      color: var(--text-muted);
      flex-shrink: 0;
      margin-left: 8px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    h2 {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin: 0 0 6px;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 11px;
      font-weight: 400;
      padding: 2px 4px;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: none;
      color: var(--accent-hover);
      text-decoration: underline;
    }

    #recently-closed {
      list-style: none;
      margin: 0 0 4px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-y: auto;
      max-height: 240px;
    }

    .closed-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
    }

    .closed-item:hover {
      background-color: var(--surface);
    }

    .closed-item + .closed-item {
      border-top: 1px solid var(--border);
    }

    .closed-info {
      flex-grow: 1;
      min-width: 0;
    }

    .closed-url {
      display: block;
      font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .closed-meta {
      display: block;
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .reopen-btn {
      flex-shrink: 0;
      padding: 3px 9px;
      font-size: 11px;
    }

    .empty-state {
      padding: 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--track-off);
      transition: background-color 0.15s ease-out;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: #ffffff;
      transition: transform 0.15s ease-out, background-color 0.15s ease-out;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
      background-color: var(--on-accent);
    }

    .popup-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 10px;
      font-size: 11px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      color: var(--accent-hover);
    }

    #version-link {
      color: var(--text-muted);
    }

    /* Keyboard focus */
    .switch input:focus-visible + .slider,
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>TabCloser</h1>
  </div>

  <div class="status-row">
    <span class="status-text">
      <strong id="status-title">Active</strong>
      <small id="status-detail">Watching for leftover tabs</small>
    </span>
    <label class="switch">
      <input type="checkbox" id="active-toggle" role="switch" aria-label="TabCloser active">
      <span class="slider"></span>
    </label>
  </div>

  <div class="snooze-row">
    <button type="button" id="snooze-btn" class="secondary">Pause for 15 minutes</button>
  </div>

  <a href="#" id="open-settings" class="manage-row" aria-label="Open TabCloser settings">
    <span class="manage-icon" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    </span>
    <span class="manage-text">
      <strong>Manage services &amp; custom rules</strong>
      <small id="manage-detail">Loading…</small>
    </span>
    <span class="manage-chevron" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
  </a>

  <div class="list-header">
    <h2>Recently closed</h2>
    <button type="button" id="clear-closed" class="clear-btn" hidden>Clear</button>
  </div>
  <ul id="recently-closed"></ul>

  <div class="popup-footer">
    <a href="https://github.com/sethcottle/tabcloser/releases" target="_blank" id="version-link"></a>
  </div>

  <script src="patterns.js"></script>
  <script src="popup.js"></script>
</body>
</html>
